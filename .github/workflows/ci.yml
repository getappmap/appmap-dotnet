name: CI

# Workflows stay thin: each job builds/tests and calls a script under
# scripts/ci/, so the test logic can be run and iterated on locally.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Linux: build everything and run the unit tests. The net472 / net462
  # targets build here against the Microsoft.NETFramework.ReferenceAssemblies
  # package (compile-only).
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build AppMap.sln -c Release
      - name: Test
        run: dotnet test test/AppMap.Agent.Tests/AppMap.Agent.Tests.csproj -c Release --no-build
      - name: Runner smoke (zero-touch PetClinic via appmap-dotnet)
        run: bash scripts/ci/runner-smoke.sh

  # Windows: build + test on real .NET Framework reference assemblies, then
  # validate the classic (native) Windows PDB fallback for real.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build solution
        run: dotnet build AppMap.sln -c Release
      - name: Test
        run: dotnet test test/AppMap.Agent.Tests/AppMap.Agent.Tests.csproj -c Release --no-build
      - name: Windows PDB smoke (record + assert relative source locations)
        shell: pwsh
        run: ./scripts/ci/windows-pdb-smoke.ps1
      - name: Upload the Windows-recorded AppMap
        uses: actions/upload-artifact@v4
        with:
          name: windows-appmaps
          path: examples/HelloAppMap/tmp/appmap

  # R4 cross-platform: a map RECORDED ON WINDOWS (above) must INDEX and QUERY
  # ON LINUX, with its source paths resolving against a Linux checkout.
  cross-platform-query:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install AppMap CLI
        run: |
          npm install -g @appland/appmap --ignore-scripts
          # index/query use better-sqlite3's native binding, skipped by --ignore-scripts.
          ( cd "$(npm root -g)/@appland/appmap" && npm rebuild better-sqlite3 )
      - name: Download the Windows-recorded AppMap
        uses: actions/download-artifact@v4
        with:
          name: windows-appmaps
          path: windows-maps
      - name: Index + query the Windows map on Linux
        run: bash scripts/ci/check-windows-maps-on-linux.sh windows-maps

  # Classic-ASP.NET (System.Web) IHttpModule on a real IIS host (IIS Express).
  # The app references no AppMap source; the agent attaches only via its
  # module registration in web.config.
  system-web-iis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build the System.Web module (net472)
        run: dotnet build src/AppMap.SystemWeb/AppMap.SystemWeb.csproj -c Release
      - name: IIS Express smoke (record + assert per-request map)
        shell: pwsh
        run: ./scripts/ci/system-web-iis-smoke.ps1
